name: Build e Release

# - Todo push / pull request na main: compila e guarda o .exe como "artifact" (aba Actions).
# - Push de uma tag "v*" (ex.: v2.0.0): compila e publica o .exe na página de Releases,
#   com link fixo de download:
#   https://github.com/<usuario>/<repositorio>/releases/latest/download/DGX-Virus-Remover.exe
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # necessário para criar a Release e anexar o .exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Compilar (csc do .NET Framework 4.8)
        shell: cmd
        run: build.bat ci

      - name: Conferir que o .exe não detecta a si mesmo
        shell: pwsh
        run: |
          # nenhuma assinatura de vírus pode aparecer em texto puro dentro do executável
          $b = [IO.File]::ReadAllBytes("DGX Virus Remover.exe")
          $ascii = [Text.Encoding]::GetEncoding(28591).GetString($b)
          $utf16 = [Text.Encoding]::Unicode.GetString($b) + [Text.Encoding]::Unicode.GetString($b, 1, $b.Length - 1)
          $sigs = @(-join [char[]](84,74,112,114,111,106,77,97,105,110), 'Drive Watcher Stop', 'CodeGear RAD Studio', 'EXERESX', 'EXEVSNX', 'trjFN')
          $bad = $sigs | Where-Object { $ascii.Contains($_) -or $utf16.Contains($_) }
          if ($bad) { Write-Error ("Assinatura em texto puro no .exe: " + ($bad -join ', ')); exit 1 }
          Write-Host "OK: nenhuma assinatura em texto puro."

      - name: Preparar arquivos de download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "DGX Virus Remover.exe" "dist\DGX-Virus-Remover.exe"
          $h = (Get-FileHash "dist\DGX-Virus-Remover.exe" -Algorithm SHA256).Hash.ToLower()
          "$h  DGX-Virus-Remover.exe" | Out-File -Encoding ascii "dist\DGX-Virus-Remover.exe.sha256"
          Copy-Item "LEIA-ME.txt" "dist\LEIA-ME.txt"
          Write-Host "SHA256: $h"

      - name: Guardar o .exe (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: DGX-Virus-Remover
          path: dist/

      - name: Publicar na Release (somente em tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DGX Virus Remover ${{ github.ref_name }}
          files: |
            dist/DGX-Virus-Remover.exe
            dist/DGX-Virus-Remover.exe.sha256
            dist/LEIA-ME.txt
          body: |
            ## Download
            **[DGX-Virus-Remover.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/DGX-Virus-Remover.exe)** — Windows 7/8/10/11 (.NET Framework 4.8, já vem no Windows). Pede administrador ao abrir.

            O arquivo `.sha256` serve para conferir que o download não foi alterado.
            Como o executável não tem assinatura digital, o Windows SmartScreen pode avisar na primeira execução: "Mais informações" → "Executar assim mesmo".
